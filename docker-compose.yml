x-backend-build: &backend-build
  context: ./backend
  dockerfile: Dockerfile
  network: host

x-backend-healthcheck: &backend-healthcheck
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 30s

x-domain-environment: &domain-environment
  EUREKA_URL: http://registry:8761/eureka
  NEO4J_URI: bolt://neo4j:7687
  NEO4J_USERNAME: neo4j
  NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}

x-domain-dependencies: &domain-dependencies
  neo4j:
    condition: service_healthy
  registry:
    condition: service_healthy

services:
  # frontend:
  #   build:
  #     context: ./frontend
  #     network: host
  #   environment:
  #     NG_ALLOWED_HOSTS: ${FRONTEND_ALLOWED_HOSTS:-localhost,127.0.0.1,frontend}
  #     PORT: 4000
  #   ports:
  #     - "127.0.0.1:${FRONTEND_PORT:-4200}:4000"
  #   depends_on:
  #     api-gateway:
  #       condition: service_healthy
  #   healthcheck:
  #     test: ["CMD-SHELL", "wget -q --spider http://localhost:4000/"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 12
  #     start_period: 10s

  api-gateway:
    build:
      <<: *backend-build
      args:
        SERVICE: api-gateway
    environment:
      API_GATEWAY_PORT: 8443
      EUREKA_URL: http://registry:8761/eureka
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-3600000}
    ports:
      - "127.0.0.1:${API_GATEWAY_PORT:-8443}:8443"
    depends_on:
      registry:
        condition: service_healthy
      user-service:
        condition: service_healthy
    healthcheck:
      <<: *backend-healthcheck
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8443/actuator/health"]

  registry:
    build:
      <<: *backend-build
      args:
        SERVICE: registry
    environment:
      REGISTRY_PORT: 8761
    healthcheck:
      <<: *backend-healthcheck
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8761/actuator/health"]

  user-service:
    build:
      <<: *backend-build
      args:
        SERVICE: user-service
    environment:
      <<: *domain-environment
      USER_SERVICE_PORT: 8083
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-3600000}
    depends_on: *domain-dependencies
    healthcheck:
      <<: *backend-healthcheck
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8083/actuator/health"]

  # movie-service:
