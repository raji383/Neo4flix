spring:
  application:
    name: api-gateway
  config:
    import: optional:file:${ENV_FILE:../../.env}[.properties]
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              "[/**]":
                allowed-origins: http://localhost:4200
                allowed-methods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowed-headers:
                  - Authorization
                  - Content-Type
          routes:
            - id: user-auth
              uri: lb://user-service
              predicates:
                - Path=/api/auth/**
                - Path=/api/users/**
            - id: movie-service
              uri: lb://movie-service
              predicates:
                - Path=/api/movies/**
server:
  port: ${API_GATEWAY_PORT}
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:3600000}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
