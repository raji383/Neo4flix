<aside class="sidebar" [class.collapsed]="collapsed()">
  <div class="top">
    <a class="brand" routerLink="/movies">
      <!-- clapperboard -->
      <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M20.2 6 3 11l-.9-2.4c-.3-1.1.3-2.2 1.3-2.5l13.5-4c1.1-.3 2.2.3 2.5 1.3Z" />
        <path d="m6.2 5.3 3.1 3.9" />
        <path d="m12.4 3.4 3.1 4" />
        <path d="M3 11h18v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z" />
      </svg>
      <span class="brand-text">Neo<span>4</span>flix</span>
    </a>

    <button type="button" class="collapse-btn" (click)="toggle()"
      [attr.aria-label]="collapsed() ? 'Expand sidebar' : 'Collapse sidebar'">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        @if (collapsed()) {
          <path d="m9 18 6-6-6-6" />
        } @else {
          <path d="m15 18-6-6 6-6" />
        }
      </svg>
    </button>
  </div>

  <nav aria-label="Main navigation">
    @if (profileError(); as message) {
      <p class="sidebar-error" role="alert" [attr.title]="message">{{ message }}</p>
    }

    <!-- Movies: film strip -->
    <a routerLink="/movies" routerLinkActive="active" ariaCurrentWhenActive="page" title="Movies">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect width="18" height="18" x="3" y="3" rx="2" />
        <path d="M7 3v18" /><path d="M3 7.5h4" /><path d="M3 12h18" /><path d="M3 16.5h4" />
        <path d="M17 3v18" /><path d="M17 7.5h4" /><path d="M17 16.5h4" />
      </svg>
      <span class="label">Movies</span>
    </a>

    <!-- Recommendations: sparkles -->
    <a routerLink="/recommendations" routerLinkActive="active" ariaCurrentWhenActive="page" title="Recommendations">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z" />
        <path d="M20 3v4" /><path d="M22 5h-4" /><path d="M4 17v2" /><path d="M5 18H3" />
      </svg>
      <span class="label">Recommendations</span>
    </a>

    <!-- Ratings: star -->
    <a routerLink="/rating" routerLinkActive="active" ariaCurrentWhenActive="page" title="Ratings">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z" />
      </svg>
      <span class="label">Ratings</span>
    </a>

    <!-- Profile: user in a circle -->
    <a routerLink="/profile" routerLinkActive="active" ariaCurrentWhenActive="page" title="Profile">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="10" />
        <circle cx="12" cy="10" r="3" />
        <path d="M7 20.662V19a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v1.662" />
      </svg>
      <span class="label">Profile</span>
    </a>

    @if (user()?.role === 'ADMIN') {
      <!-- Dashboard: control panel tiles -->
      <a routerLink="/dashboard" routerLinkActive="active" ariaCurrentWhenActive="page" title="Admin">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect width="7" height="9" x="3" y="3" rx="1" />
          <rect width="7" height="5" x="14" y="3" rx="1" />
          <rect width="7" height="9" x="14" y="12" rx="1" />
          <rect width="7" height="5" x="3" y="16" rx="1" />
        </svg>
        <span class="label">Dashboard</span>
      </a>
    }
  </nav>

  <!-- Logout: arrow leaving a door -->
  <button type="button" class="logout" (click)="onLogout()" title="Logout">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
      <path d="m16 17 5-5-5-5" />
      <path d="M21 12H9" />
    </svg>
    <span class="label">Logout</span>
  </button>
</aside>
