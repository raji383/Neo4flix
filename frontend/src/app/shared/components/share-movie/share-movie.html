<div class="share-movie">
    <button type="button" class="share-movie__copy" (click)="copyLink()" aria-label="Copy movie link">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect width="14" height="14" x="8" y="2" rx="2" ry="2" />
            <path d="M4 6c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2" />
        </svg>
        @if (copied()) {
        <span>✓ Copied</span>
        } @else {
        <span>Copy link</span>
        }
    </button>

    @if (error()) {
    <p class="share-movie__error" role="alert">
        {{ error() }}
    </p>
    }

    @if (copied()) {
    <span class="share-movie__success" role="status">
        Movie link copied to clipboard.
    </span>
    }
</div>
