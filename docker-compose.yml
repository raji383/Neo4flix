  #     args:
  #       SERVICE: rating-service
  #   environment:
  #     <<: *domain-environment
  #     RATING_SERVICE_PORT: 8081
  #   depends_on: *domain-dependencies
  #   healthcheck:
  #     <<: *backend-healthcheck
  #     test: ["CMD-SHELL", "wget -q --spider http://localhost:8081/actuator/health"]

  # recommendation-service:
  #   build:
  #     <<: *backend-build
  #     args:
  #       SERVICE: recommendation-service
  #   environment:
  #     <<: *domain-environment
  #     RECOMMENDATION_SERVICE_PORT: 8082
