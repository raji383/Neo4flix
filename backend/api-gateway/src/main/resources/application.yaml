spring:
  application:
    name: api-gateway
  config:
    import: optional:file:${ENV_FILE:../../.env}[.properties]
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              "[/**]":
                allowed-origins: ${CORS_ALLOWED_ORIGINS:https://localhost:4200,http://localhost:4200}
                allowed-methods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - PATCH
                  - OPTIONS
                allowed-headers:
                  - "*"
                allow-credentials: true
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
          routes:
            - id: user-auth
              uri: lb://user-service
              predicates:
                - Path=/api/auth/**
            - id: user-profile
              uri: lb://user-service
              predicates:
                - Path=/api/users/**
            - id: movie-service
              uri: lb://movie-service
              predicates:
                - Path=/api/movies/**
            - id: genre-service
              uri: lb://movie-service
              predicates:
                - Path=/api/genres/**
            - id: recommendation-service
              uri: lb://recommendation-service
              predicates:
                - Path=/api/recommendations/**
            - id: rating-service
              uri: lb://rating-service
              predicates:
                - Path=/api/ratings/**

server:
  port: ${API_GATEWAY_PORT}

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:3600000}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
