name: neo4flix

services:
  neo4j:
    image: neo4j:5.26.33-community
    environment:
      NEO4J_AUTH: "${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}"
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#*/}\" 'RETURN 1' >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  registry:
    build:
      context: ./backend/registry
    restart: unless-stopped
    environment:
      REGISTRY_PORT: "${REGISTRY_PORT:-8761}"
    ports:
      - "${REGISTRY_PORT:-8761}:${REGISTRY_PORT:-8761}"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:${REGISTRY_PORT:-8761}/actuator/health || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s

  user-service:
    build:
      context: ./backend/user-service
    restart: unless-stopped
    environment:
      USER_SERVICE_PORT: "${USER_SERVICE_PORT:-8083}"
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: "${NEO4J_USERNAME:-neo4j}"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}"
      JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET in .env}"
      JWT_EXPIRATION: "${JWT_EXPIRATION:-3600000}"
      EUREKA_URL: "http://registry:${REGISTRY_PORT:-8761}/eureka"
      ADMIN_BOOTSTRAP_ENABLED: "${ADMIN_BOOTSTRAP_ENABLED:-false}"
      ADMIN_USERNAME: "${ADMIN_USERNAME:-admin}"
      ADMIN_EMAIL: "${ADMIN_EMAIL:-admin@neo4flix.local}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      ADMIN_USER_ID: "${ADMIN_USER_ID:-}"
    depends_on:
      neo4j:
        condition: service_healthy
      registry:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:${USER_SERVICE_PORT:-8083}/actuator/health || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s

  movie-service:
    build:
      context: ./backend/movie-service
    restart: unless-stopped
    environment:
      MOVIE_SERVICE_PORT: "${MOVIE_SERVICE_PORT:-8080}"
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: "${NEO4J_USERNAME:-neo4j}"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}"
      EUREKA_URL: "http://registry:${REGISTRY_PORT:-8761}/eureka"
      CLOUDINARY_CLOUD_NAME: "${CLOUDINARY_CLOUD_NAME:?Set CLOUDINARY_CLOUD_NAME in .env}"
      CLOUDINARY_API_KEY: "${CLOUDINARY_API_KEY:?Set CLOUDINARY_API_KEY in .env}"
      CLOUDINARY_API_SECRET: "${CLOUDINARY_API_SECRET:?Set CLOUDINARY_API_SECRET in .env}"
      TMDB_ACCESS_TOKEN: "${TMDB_ACCESS_TOKEN:-}"
      MOVIE_SEED_ENABLED: "${MOVIE_SEED_ENABLED:-false}"
      MOVIE_SEED_COUNT: "${MOVIE_SEED_COUNT:-100}"
      MOVIE_SEED_OWNER: "${MOVIE_SEED_OWNER:-${ADMIN_USER_ID:-}}"
      ADMIN_USER_ID: "${ADMIN_USER_ID:-}"
    depends_on:
      neo4j:
        condition: service_healthy
      registry:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:${MOVIE_SERVICE_PORT:-8080}/actuator/health || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s

  rating-service:
    build:
      context: ./backend/rating-service
    restart: unless-stopped
    environment:
      RATING_SERVICE_PORT: "${RATING_SERVICE_PORT:-8081}"
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: "${NEO4J_USERNAME:-neo4j}"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}"
      EUREKA_URL: "http://registry:${REGISTRY_PORT:-8761}/eureka"
    depends_on:
      neo4j:
        condition: service_healthy
      registry:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:${RATING_SERVICE_PORT:-8081}/actuator/health || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s

  recommendation-service:
    build:
      context: ./backend/recommendation-service
    restart: unless-stopped
    environment:
      RECOMMENDATION_SERVICE_PORT: "${RECOMMENDATION_SERVICE_PORT:-8082}"
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: "${NEO4J_USERNAME:-neo4j}"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}"
      EUREKA_URL: "http://registry:${REGISTRY_PORT:-8761}/eureka"
    depends_on:
      neo4j:
        condition: service_healthy
      registry:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:${RECOMMENDATION_SERVICE_PORT:-8082}/actuator/health || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s

  api-gateway:
    build:
      context: ./backend/api-gateway
    restart: unless-stopped
    environment:
      API_GATEWAY_PORT: "${API_GATEWAY_PORT:-8443}"
      API_GATEWAY_SSL_PASS: "${API_GATEWAY_SSL_PASS:?Set API_GATEWAY_SSL_PASS in .env}"
      JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET in .env}"
      JWT_EXPIRATION: "${JWT_EXPIRATION:-3600000}"
      EUREKA_URL: "http://registry:${REGISTRY_PORT:-8761}/eureka"
    depends_on:
      registry:
        condition: service_healthy
      user-service:
        condition: service_healthy
      movie-service:
        condition: service_healthy
      rating-service:
        condition: service_healthy
      recommendation-service:
        condition: service_healthy
    ports:
      - "${API_GATEWAY_PORT:-8443}:${API_GATEWAY_PORT:-8443}"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -kfsS https://localhost:${API_GATEWAY_PORT:-8443}/actuator/health || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-4200}:80"
      - "8444:443"
    depends_on:
      api-gateway:
        condition: service_healthy

volumes:
  neo4j-data:
