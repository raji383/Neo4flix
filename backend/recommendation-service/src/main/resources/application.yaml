
spring:
  config:
    import: optional:file:${ENV_FILE:../../.env}[.properties]

  application:
    name: recommendation-service

  neo4j:
    uri: ${NEO4J_URI:bolt://localhost:7687}
    authentication:
      username: ${NEO4J_USERNAME:neo4j}
      password: ${NEO4J_PASSWORD}

  data:
    neo4j:
      database: neo4j

server:
  port: ${RECOMMENDATION_SERVICE_PORT:8084}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: never
