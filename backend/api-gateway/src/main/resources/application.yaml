spring:
  application:
    name: api-gateway
  config:
    import: optional:file:${ENV_FILE:../../.env}[.properties]
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-auth
              uri: lb://user-service
              predicates:
                - Path=/api/auth/**
            - id: user-profile
              uri: lb://user-service
              predicates:
                - Path=/api/users/**
            - id: movie-service
              uri: lb://movie-service
              predicates:
                - Path=/api/movies/**
            - id: genre-service
              uri: lb://movie-service
              predicates:
                - Path=/api/genres/**
server:
  port: ${API_GATEWAY_PORT}
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:3600000}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
